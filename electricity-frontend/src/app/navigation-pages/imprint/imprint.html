<div class="impressum-page">
  <!-- Banner Image -->
  <div class="banner">
    <img
      *ngIf="content?.logoPath"
      [src]="staticContentService.getImageUrl(content?.logoPath)"
      alt="Banner"
    />
  </div>

  <!-- Title -->
  <div class="page-title">
    <span>{{ content?.title }}</span>
  </div>

  <!-- Content Box -->
  <div class="impressum-card">
    <div class="content-wrapper">
      <div
        class="right"
        [innerHTML]="content?.description">
      </div>
    </div>
  </div>
  
</div>
